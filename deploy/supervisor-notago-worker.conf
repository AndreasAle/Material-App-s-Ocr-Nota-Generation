; /etc/supervisor/conf.d/notago-worker.conf
; Queue worker untuk Scan Nota (OCR/AI) & notifikasi. Supervisor menjalankan ulang otomatis bila mati.
[program:notago-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/notago/artisan queue:work database --sleep=3 --tries=1 --timeout=300 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/notago/storage/logs/worker.log
stopwaitsecs=320
