# /etc/nginx/sites-available/notago  — ganti toko.contoh.com & path sesuai server
server {
    listen 80;
    server_name toko.contoh.com;
    root /var/www/notago/public;
    index index.php;

    # Upload nota & dokumen (sesuaikan dengan upload_max_filesize di php.ini)
    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 180;
    }

    # Jangan pernah layani file tersembunyi (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # File di storage publik tidak boleh dieksekusi sebagai PHP
    location ^~ /storage/ {
        location ~ \.php$ { deny all; }
    }
}
# HTTPS: jalankan `sudo certbot --nginx -d toko.contoh.com` setelah DNS mengarah ke server.
